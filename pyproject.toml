[project]
name = "mojo-mecab-python3"
version = "0.1.0"
description = "MeCab-compatible lattice decoding kernels implemented in Mojo"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Lee Penkman", email = "leepenkman@gmail.com" }]
keywords = ["mojo", "mecab", "japanese", "morphological-analysis", "viterbi"]
dependencies = ["numpy", "mecab-python3[unidic-lite]>=1.0.12"]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "python" }

[tool.setuptools.packages.find]
where = ["python"]
